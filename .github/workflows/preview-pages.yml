name: Preview on GitHub Pages

on:
  push:
    branches:
      - 'cursor/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /Russo/preview/
      - run: cp dist/index.html dist/404.html

      - name: Publish preview to gh-pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview
          keep_files: true

      - name: Preview URL
        run: echo "https://ankig83.github.io/Russo/preview/"
