name: Preview on Beget VPS

on:
  push:
    branches:
      - 'cursor/**'
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate secrets
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
        run: |
          test -n "$BEGET_HOST" || { echo "::error::Secret BEGET_HOST не задан"; exit 1; }
          test -n "$BEGET_USER" || { echo "::error::Secret BEGET_USER не задан"; exit 1; }
          test -n "$BEGET_PASSWORD" || { echo "::error::Secret BEGET_PASSWORD не задан"; exit 1; }

      - run: npm ci
      - run: npm run build

      - name: Install deploy tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync openssh-client

      - name: Upload preview to VPS
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
        run: |
          sshpass -p "$BEGET_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "${BEGET_USER}@${BEGET_HOST}" \
            "mkdir -p /var/www/russo-preview"

          sshpass -p "$BEGET_PASSWORD" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
            dist/ "${BEGET_USER}@${BEGET_HOST}:/var/www/russo-preview/"

      - name: Fix permissions on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: ${{ secrets.BEGET_USER }}
          password: ${{ secrets.BEGET_PASSWORD }}
          port: 22
          timeout: 30s
          script: |
            chown -R www-data:www-data /var/www/russo-preview
            rm -f /var/www/russo-preview/models/shkaf_full.glb

      - name: Preview URL hint
        run: |
          echo "Превью залито в /var/www/russo-preview на VPS."
          echo "Откройте preview-домен или поддомен, указывающий на эту папку."
