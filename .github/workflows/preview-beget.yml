name: Preview on Beget VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beget-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Validate secrets
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
        run: |
          test -n "$BEGET_HOST" || { echo "::error::Secret BEGET_HOST не задан"; exit 1; }
          test -n "$BEGET_USER" || { echo "::error::Secret BEGET_USER не задан"; exit 1; }
          test -n "$BEGET_PASSWORD" || { echo "::error::Secret BEGET_PASSWORD не задан"; exit 1; }

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass openssh-client rsync

      - name: Trust VPS host key
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "$BEGET_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload preview to VPS
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
        run: |
          SSHPASS="$BEGET_PASSWORD" sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "${BEGET_USER}@${BEGET_HOST}" \
            "mkdir -p /var/www/russo-preview"

          SSHPASS="$BEGET_PASSWORD" sshpass -e rsync -avz --delete \
            --exclude 'models/shkaf_full.glb' \
            -e "ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=30" \
            dist/ "${BEGET_USER}@${BEGET_HOST}:/var/www/russo-preview/"

          SSHPASS="$BEGET_PASSWORD" sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            "${BEGET_USER}@${BEGET_HOST}" \
            "test -s /var/www/russo-preview/index.html && chmod -R a+rX /var/www/russo-preview"

      - name: Preview URL hint
        run: |
          echo "Превью залито в /var/www/russo-preview"
          echo "URL (после nginx): http://93.189.229.230:8080/"
