name: Deploy to Beget VPS

on:
  push:
    branches: [beget]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beget-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Validate secrets
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
          BEGET_KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: |
          test -n "$BEGET_HOST" || { echo "::error::Secret BEGET_HOST не задан"; exit 1; }
          test -n "$BEGET_USER" || { echo "::error::Secret BEGET_USER не задан"; exit 1; }
          test -n "$BEGET_SSH_KEY" || { echo "::error::Secret BEGET_SSH_KEY не задан"; exit 1; }
          test -n "$BEGET_KNOWN_HOSTS" || { echo "::error::Secret BEGET_KNOWN_HOSTS не задан"; exit 1; }

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Configure pinned SSH identity
        env:
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
          BEGET_KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BEGET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH to VPS
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "${BEGET_USER}@${BEGET_HOST}" \
            "mkdir -p /var/www/russo"

      - name: Upload dist to VPS
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          rsync -avz --delete \
            --exclude 'models/shkaf_full.glb' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            dist/ "${BEGET_USER}@${BEGET_HOST}:/var/www/russo/"

      - name: Verify deployed files
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${BEGET_USER}@${BEGET_HOST}" \
            "test -s /var/www/russo/index.html && chmod -R a+rX /var/www/russo"
