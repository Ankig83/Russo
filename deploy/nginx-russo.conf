server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.ru www.YOUR_DOMAIN.ru;

    root /var/www/russo;
    index index.html;

    # HTML всегда перепроверяется, иначе после деплоя останется старая оболочка.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Крупные бинарники уже сжаты (Draco, PNG, WebP). Gzip им почти не помогает.
    # Долгий кэш безопасен, пока в URL есть ?v= или хеш.
    location /models/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /textures/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /video/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /HDRI/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA — все маршруты React Router → index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
}

