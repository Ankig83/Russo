# Превью веток cursor/** — один раз на VPS:
#   sudo cp deploy/nginx-russo-preview.conf /etc/nginx/sites-available/russo-preview
#   sudo ln -sf /etc/nginx/sites-available/russo-preview /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 8080/tcp
#
# URL: http://93.189.229.230:8080/

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/russo-preview;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /models/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location /textures/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location /video/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location /HDRI/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
}
