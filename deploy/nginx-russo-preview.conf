# Превью веток cursor/** — один раз на VPS:
#   sudo cp deploy/nginx-russo-preview.conf /etc/nginx/sites-available/russo-preview
#   sudo ln -sf /etc/nginx/sites-available/russo-preview /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 8080/tcp
#
# URL: http://93.189.229.230:8080/

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/russo-preview;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /models/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
